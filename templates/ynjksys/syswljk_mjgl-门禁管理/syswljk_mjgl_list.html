{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>门禁管理</title>
  <link rel="stylesheet" href="{% static 'ynjksys/syswljk_mjgl_list.css' %}?v=2026081701">
  <script src="{% static 'common/isvar.js' %}"></script><script src="{% static 'common/isqrydata.js' %}"></script><script src="{% static 'ynjksys/syswljk_query_guard.js' %}?v=2026081701"></script>
</head>
<body><main class="page">
  <section class="metrics"><table><thead><tr><th>门禁控制器</th><th>实验室/区域</th><th>查询记录</th><th>进入记录</th><th>离开记录</th></tr></thead><tbody><tr><td><strong id="mControllers">--</strong><span>台</span></td><td><strong id="mAreas">--</strong><span>个</span></td><td><strong id="mRecords">--</strong><span>条</span></td><td class="good"><strong id="mEntry">--</strong><span>条</span></td><td><strong id="mExit">--</strong><span>条</span></td></tr></tbody></table></section>
  <section class="panel"><nav class="tabs"><button class="active" data-tab="monitor">实验室监控</button><button data-tab="records">门禁事件</button><button data-tab="devices">门禁设备</button><button data-tab="people">人员查询</button><button data-tab="operations">操作记录</button></nav>
    <div class="query" id="queryPanel">
      <label data-for="monitor records"><span>所属区域</span><select id="area"><option value="">全部区域</option></select></label>
      <label data-for="monitor records"><span>门禁设备</span><select id="device"><option value="">全部设备</option></select></label>
      <label data-for="records"><span>人员</span><input id="keyword" placeholder="姓名、人员编号或卡号"></label>
      <label data-for="records"><span>出入方向</span><select id="direction"><option value="">全部方向</option><option>进入</option><option>离开</option></select></label>
      <label data-for="records"><span>验证方式</span><select id="verify"><option value="">全部方式</option><option value="15">人脸识别</option></select></label>
      <label data-for="records"><span>开始时间</span><input id="startTime" type="datetime-local"></label><label data-for="records"><span>结束时间</span><input id="endTime" type="datetime-local"></label>
      <label data-for="devices people"><span>关键字</span><input id="optionKeyword" placeholder="人员、设备或区域"></label>
      <div data-for="monitor records devices people"><button class="button" id="reset">重置</button><button class="button primary" id="search">查询</button></div>
    </div>
  </section>

  <section id="monitorView" class="monitor-layout">
    <section class="panel door-panel"><header class="section-head"><i></i><h1>实验室门点</h1><em id="monitorSummary"></em><button class="button" data-refresh>刷新</button></header><div class="door-grid" id="doorGrid"></div></section>
    <section class="panel event-panel"><header class="section-head"><i></i><h1>最近门禁事件</h1></header><div class="event-stream" id="eventStream"></div></section>
  </section>

  <section id="listView" class="panel list hidden"><header><i></i><h1 id="listTitle">门禁事件</h1><em id="summary"></em><div id="headActions" class="head-actions"></div></header><div class="table-scroll"><table><thead id="thead"></thead><tbody id="tbody"><tr><td class="loading">正在加载...</td></tr></tbody></table></div><div class="pagination" id="pagination"></div></section>
</main>
<div class="modal hidden" id="modal"><div class="mask" data-close></div><section><header><h2 id="modalTitle"></h2><button data-close>×</button></header><div class="modal-body" id="modalBody"></div><footer><button class="button primary" data-close>关闭</button></footer></section></div><div class="toast hidden" id="toast"></div>
<script src="{% static 'ynjksys/syswljk_mjgl_service.js' %}?v=2026081702"></script><script src="{% static 'ynjksys/syswljk_mjgl_list.js' %}?v=2026081701"></script></body></html>
