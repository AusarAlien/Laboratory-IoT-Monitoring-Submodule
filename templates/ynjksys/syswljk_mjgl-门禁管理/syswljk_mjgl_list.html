{% load static %}
<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>门禁管理</title><link rel="stylesheet" href="{% static 'ynjksys/syswljk_mjgl_list.css' %}?v=2026081301"><script src="{% static 'common/isvar.js' %}"></script><script src="{% static 'common/isqrydata.js' %}"></script></head><body><main class="page">
<section class="metrics"><table><thead><tr><th>门禁设备</th><th>查询记录</th><th>进入记录</th><th>离开记录</th><th>人脸识别</th></tr></thead><tbody><tr><td><strong id="mControllers">--</strong><span>台</span></td><td><strong id="mRecords">--</strong><span>条</span></td><td class="good"><strong id="mEntry">--</strong><span>条</span></td><td><strong id="mExit">--</strong><span>条</span></td><td><strong id="mFace">--</strong><span>条</span></td></tr></tbody></table></section>
<section class="panel"><nav class="tabs"><button class="active" data-tab="latest">最新记录</button><button data-tab="devices">门禁设备</button><button data-tab="people">门禁人员</button><button data-tab="records">门禁记录</button></nav><div class="query" id="queryPanel">
<label data-for="record"><span>人员</span><input id="keyword" placeholder="姓名、人员编号或卡号"></label><label data-for="record"><span>所属区域</span><select id="area"><option value="">全部区域</option></select></label><label data-for="record"><span>门禁设备</span><select id="device"><option value="">全部设备</option></select></label><label data-for="record"><span>出入方向</span><select id="direction"><option value="">全部方向</option><option>进入</option><option>离开</option></select></label>
<label data-for="record"><span>验证方式</span><select id="verify"><option value="">全部方式</option><option value="15">人脸识别</option></select></label><label data-for="record"><span>开始时间</span><input id="startTime" type="datetime-local"></label><label data-for="record"><span>结束时间</span><input id="endTime" type="datetime-local"></label><label data-for="option"><span>关键字</span><input id="optionKeyword" placeholder="人员、设备或区域"></label><div><button class="button" id="reset">重置</button><button class="button primary" id="search">查询</button></div></div></section>
<section class="panel list"><header><i></i><h1 id="listTitle">最新门禁记录</h1><em id="summary"></em><div id="headActions" class="head-actions"></div></header><div class="table-scroll"><table><thead id="thead"></thead><tbody id="tbody"><tr><td class="loading">正在加载...</td></tr></tbody></table></div><div class="pagination" id="pagination"></div></section></main>
<div class="modal hidden" id="modal"><div class="mask" data-close></div><section><header><h2 id="modalTitle"></h2><button data-close>×</button></header><div class="modal-body" id="modalBody"></div><footer><button class="button primary" data-close>关闭</button></footer></section></div><div class="toast hidden" id="toast"></div>
<script src="{% static 'ynjksys/syswljk_mjgl_service.js' %}?v=2026081301"></script><script src="{% static 'ynjksys/syswljk_mjgl_list.js' %}?v=2026081301"></script></body></html>
