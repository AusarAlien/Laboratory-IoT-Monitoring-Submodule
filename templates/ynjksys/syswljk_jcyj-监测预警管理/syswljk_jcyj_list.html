{% load static %}
<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>监测预警管理</title><link rel="stylesheet" href="{% static 'ynjksys/syswljk_jcyj_list.css' %}?v=2026081403"><script src="{% static 'common/isvar.js' %}"></script><script src="{% static 'common/isqrydata.js' %}"></script><script src="{% static 'ynjksys/syswljk_query_guard.js' %}?v=2026081701"></script></head><body>
<main class="page-container">
<section class="metric-panel"><table class="metric-table"><thead><tr><th>历史预警</th><th>监测设备</th><th>监测指标</th><th>待确认</th><th>已处理</th><th>已失效</th></tr></thead><tbody><tr><td><strong id="metricTotal">0</strong><span>条</span></td><td><strong id="metricDevices">0</strong><span>台</span></td><td><strong id="metricMetrics">0</strong><span>项</span></td><td class="warning"><strong id="metricPending">0</strong><span>条</span></td><td class="success"><strong id="metricHandled">0</strong><span>条</span></td><td class="danger"><strong id="metricInvalid">0</strong><span>条</span></td></tr></tbody></table></section>
<nav class="page-tabs"><button class="page-tab is-active" data-tab="alarm">预警信息</button><button class="page-tab" data-tab="rule">阈值规则</button><button class="page-tab" data-tab="push">推送记录</button></nav>

<section id="alarmPanel" class="tab-panel"><div class="query-panel"><div class="query-grid"><label class="form-item date-item"><span>预警时间</span><div class="date-range"><input id="alarmStart" type="date"><b>至</b><input id="alarmEnd" type="date"></div></label><label class="form-item"><span>设备名称</span><select id="alarmDevice"><option value="">全部设备</option></select></label><label class="form-item"><span>监测指标</span><select id="alarmMetric"><option value="">全部指标</option></select></label><label class="form-item"><span>预警级别</span><select id="alarmLevel"><option value="">全部级别</option><option>一般</option><option>重要</option><option>紧急</option></select></label><label class="form-item"><span>处理状态</span><select id="alarmStatus"><option value="">全部状态</option><option>待确认</option><option>已处理</option><option>已失效</option></select></label><div class="query-actions"><button class="button" data-reset="alarm">重置</button><button class="button primary" data-search="alarm">查询</button></div></div></div><section class="list-panel"><header class="panel-title"><i></i><h2>设备预警信息</h2><em id="alarmSummary"></em></header><div class="table-scroll"><table class="alarm-table"><thead><tr><th class="actions">操作</th><th>序号</th><th>预警时间</th><th>预警级别</th><th>设备编号</th><th>设备名称</th><th>监测位置</th><th>监测指标</th><th>监测值</th><th>触发条件</th><th>处理状态</th></tr></thead><tbody id="alarmRows"></tbody></table><div id="alarmEmpty" class="empty is-hidden">暂无符合条件的预警信息</div></div><div id="alarmPager" class="pagination"></div></section></section>

<section id="rulePanel" class="tab-panel is-hidden"><div class="query-panel"><div class="query-grid"><label class="form-item"><span>规则名称</span><input id="ruleKeyword" placeholder="规则名称或指标"></label><label class="form-item"><span>设备类型</span><select id="ruleType"><option value="">全部类型</option></select></label><label class="form-item"><span>预警级别</span><select id="ruleLevel"><option value="">全部级别</option><option>一般</option><option>重要</option><option>紧急</option></select></label><label class="form-item"><span>使用状态</span><select id="ruleStatus"><option value="">全部状态</option><option>启用</option><option>停用</option></select></label></div></div><section class="list-panel"><header class="panel-title"><i></i><h2>监测阈值规则</h2><em id="ruleSummary"></em></header><div class="table-scroll"><table class="rule-table"><thead><tr><th class="actions wide">操作</th><th>序号</th><th>规则名称</th><th>设备类型</th><th>适用设备</th><th>监测指标</th><th>判定条件</th><th>连续次数</th><th>持续时长</th><th>预警级别</th><th>平台推送</th><th>状态</th><th>修改时间</th></tr></thead><tbody id="ruleRows"></tbody></table><div id="ruleEmpty" class="empty">暂无符合条件的阈值规则</div></div><div id="rulePager" class="pagination"></div></section></section>

<section id="pushPanel" class="tab-panel is-hidden"><section class="list-panel"><header class="panel-title"><i></i><h2>集中预警推送记录</h2><em id="pushSummary"></em></header><div class="table-scroll"><table class="push-table"><thead><tr><th class="actions">操作</th><th>序号</th><th>推送时间</th><th>预警编号</th><th>设备名称</th><th>预警级别</th><th>推送目标</th><th>推送状态</th><th>重试次数</th><th>平台返回信息</th></tr></thead><tbody id="pushRows"></tbody></table><div id="pushEmpty" class="empty">暂无符合条件的推送记录</div></div><div id="pushPager" class="pagination"></div></section></section>
</main>
<div id="modal" class="modal is-hidden"><div class="mask" data-close></div><section class="modal-card"><header><h2 id="modalTitle"></h2><button data-close>×</button></header><form id="modalForm"><div id="modalBody" class="modal-body"></div><footer><button type="button" class="button" data-close>取消</button><button id="modalSubmit" type="submit" class="button primary">保存</button></footer></form></section></div><div id="toast" class="toast is-hidden"></div>
<!-- Mock 脚本保留在代码库中作为显式降级方案，正式页面不加载。 -->
<script src="{% static 'ynjksys/syswljk_jcyj_service.js' %}?v=2026081701"></script><script src="{% static 'ynjksys/syswljk_jcyj_list.js' %}?v=2026081403"></script></body></html>
