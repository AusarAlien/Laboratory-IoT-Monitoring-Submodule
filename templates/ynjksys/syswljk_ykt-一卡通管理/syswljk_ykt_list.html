{% load static %}
<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一卡通管理</title><link rel="stylesheet" href="{% static 'ynjksys/syswljk_ykt_list.css' %}?v=2026081201"></head><body><main class="page">
<section class="metrics"><table><thead><tr><th>人员档案</th><th>有效卡片</th><th>在线设备</th><th>待同步数据</th><th>今日异常</th></tr></thead><tbody><tr><td><strong id="mPeople">0</strong><span>人</span></td><td><strong id="mCards">0</strong><span>张</span></td><td class="good"><strong id="mOnline">0</strong><span>台</span></td><td class="warn"><strong id="mPending">0</strong><span>条</span></td><td class="bad"><strong id="mAlarm">0</strong><span>条</span></td></tr></tbody></table></section>
