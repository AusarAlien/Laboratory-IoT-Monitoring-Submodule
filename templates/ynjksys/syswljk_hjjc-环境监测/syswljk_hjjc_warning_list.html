{% load static %}
<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>智能预警</title>
    <link rel="stylesheet" href="{% static 'ynjksys/syswljk_hjjc_common.css' %}?v=2026081205">
    <link rel="stylesheet" href="{% static 'ynjksys/syswljk_hjjc_warning_list.css' %}?v=2026081801">
    <script src="{% static 'common/isvar.js' %}"></script>
    <script src="{% static 'common/isqrydata.js' %}"></script>
    <script src="{% static 'common/issubmit.js' %}"></script>
    <script src="{% static 'ynjksys/syswljk_query_guard.js' %}?v=2026081701"></script>
</head>

<body>
    <main class="page-container">
        <section class="metric-panel">
            <table class="metric-table">
                <thead>
                    <tr>
                        <th>历史预警</th>
                        <th>监测点</th>
                        <th>环境项目</th>
                        <th>待确认</th>
                        <th>已处理</th>
                        <th>已失效</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><strong id="mTotal">0</strong><span>条</span></td>
                        <td><strong id="mObjects">0</strong><span>个</span></td>
                        <td><strong id="mProjects">0</strong><span>项</span></td>
                        <td class="danger"><strong id="mPending">0</strong><span>条</span></td>
                        <td class="success"><strong id="mHandled">0</strong><span>条</span></td>
                        <td><strong id="mInvalid">0</strong><span>条</span></td>
                    </tr>
                </tbody>
            </table>
        </section>
        <div class="query-panel">
            <div class="query-grid"><label class="form-item"><span>所属科室</span><select id="qDept">
                        <option value="">全部科室</option>
                    </select></label><label class="form-item"><span>监测对象</span><select id="qObject">
                        <option value="">全部对象</option>
                    </select></label><label class="form-item"><span>环境项目</span><select id="qProject">
                        <option value="">全部项目</option>
                    </select></label><label class="form-item"><span>预警等级</span><select id="qLevel">
                        <option value="">全部等级</option>
                        <option>一般</option>
                        <option>重要</option>
                        <option>紧急</option>
                    </select></label><label class="form-item"><span>处置状态</span><select id="qStatus">
                        <option value="">全部状态</option>
                        <option>待确认</option>
                        <option>已处理</option>
                        <option>已失效</option>
                    </select></label>
                <div class="query-actions"><button class="button" id="reset">重置</button><button class="button primary"
                        id="search">查询</button></div>
            </div>
        </div>
        <section class="list-panel">
            <header class="panel-title"><i></i>
                <h1>环境智能预警列表</h1><em id="summary"></em>
            </header>
            <div class="table-scroll">
                <table class="alarm-table">
                    <thead>
                        <tr>
                            <th>操作</th>
                            <th>序号</th>
                            <th>预警时间</th>
                            <th>所属科室</th>
                            <th>监测对象</th>
                            <th>环境项目</th>
                            <th>监测值</th>
                            <th>预警等级</th>
                            <th>处置状态</th>
                            <th>预警内容</th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
            <div id="pager" class="pagination"></div>
        </section>
    </main>
    <div id="modal" class="modal is-hidden">
        <div class="mask" data-close></div>
        <section class="modal-card">
            <header>
                <h2 id="modalTitle"></h2><button data-close>×</button>
            </header>
            <form id="form">
                <div class="modal-body" id="modalBody"></div>
                <footer id="modalFooter"><button type="button" class="button primary" data-close>关闭</button></footer>
            </form>
        </section>
    </div>
    <div id="toast" class="toast is-hidden"></div>
    <!-- Mock 脚本保留在代码库中作为显式降级方案，正式页面不加载。 -->
    <script src="{% static 'ynjksys/syswljk_jcyj_service.js' %}?v=2026081801"></script>
    <script src="{% static 'ynjksys/syswljk_hjjc_warning_list.js' %}?v=2026081801"></script>
</body>

</html>
