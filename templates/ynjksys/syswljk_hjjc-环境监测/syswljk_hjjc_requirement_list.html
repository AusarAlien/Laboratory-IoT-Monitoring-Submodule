{% load static %}
<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>环境设备条件一览表</title>
    <link rel="stylesheet" href="{% static 'ynjksys/syswljk_hjjc_common.css' %}?v=2026081203">
    <link rel="stylesheet" href="{% static 'ynjksys/syswljk_hjjc_requirement_list.css' %}?v=2026081203">
    <script src="{% static 'common/isvar.js' %}"></script>
    <script src="{% static 'common/isqrydata.js' %}"></script>
    <script src="{% static 'ynjksys/syswljk_query_guard.js' %}?v=2026081701"></script>
</head>

<body>
    <main class="page-container">
        <section class="metric-panel">
            <table class="metric-table">
                <thead>
                    <tr>
                        <th>条件要求</th>
                        <th>启用要求</th>
                        <th>覆盖对象</th>
                        <th>覆盖项目</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><strong id="mTotal">0</strong><span>条</span></td>
                        <td><strong id="mEnabled">0</strong><span>条</span></td>
                        <td><strong id="mObjects">0</strong><span>个</span></td>
                        <td><strong id="mProjects">0</strong><span>项</span></td>
                    </tr>
                </tbody>
            </table>
        </section>
        <div class="query-panel">
            <div class="query-grid"><label class="form-item"><span>所属实验室</span><select id="qDept">
                        <option value="">全部实验室</option>
                    </select></label><label class="form-item"><span>监测对象</span><select id="qObject">
                        <option value="">全部对象</option>
                    </select></label><label class="form-item"><span>环境项目</span><select id="qProject">
                        <option value="">全部项目</option>
                    </select></label><label class="form-item"><span>使用状态</span><select id="qStatus">
                        <option value="">全部状态</option>
                        <option>启用</option>
                        <option>停用</option>
                    </select></label>
                <div class="query-actions"><button class="button" id="reset">重置</button><button class="button primary"
                        id="search">查询</button></div>
            </div>
        </div>
        <section class="list-panel">
            <header class="panel-title"><i></i>
                <h1>环境设备条件一览表</h1><em id="summary"></em>
            </header>
            <div class="table-scroll">
                <table class="requirement-table">
                    <thead>
                        <tr>
                            <th>操作</th>
                            <th>序号</th>
                            <th>所属实验室</th>
                            <th>对象类型</th>
                            <th>监测对象</th>
                            <th>环境项目</th>
                            <th>下限</th>
                            <th>上限</th>
                            <th>单位</th>
                            <th>状态</th>
                            <th>要求来源</th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
        </section>
    </main>
    <div id="modal" class="modal is-hidden">
        <div class="mask" data-close></div>
        <section class="modal-card">
            <header>
                <h2 id="modalTitle"></h2><button data-close>×</button>
            </header>
            <form id="form">
                <div class="modal-body" id="modalBody"></div>
                <footer><button type="button" class="button" data-close>关闭</button></footer>
            </form>
        </section>
    </div>
    <div class="toast is-hidden" id="toast"></div>
    <script src="{% static 'ynjksys/syswljk_hjjc_service.js' %}?v=2026082102"></script>
    <script src="{% static 'ynjksys/syswljk_hjjc_requirement_list.js' %}?v=2026082102"></script>
</body>

</html>
