{% load static %}
<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>物联查询统计</title><link rel="stylesheet" href="{% static 'ynjksys/syswljk_cxtj_list.css' %}?v=2026081202"><script src="{% static 'common/isvar.js' %}"></script><script src="{% static 'common/isqrydata.js' %}"></script><script src="{% static 'ynjksys/syswljk_query_guard.js' %}?v=2026081701"></script><script src="{% static 'lib/echarts/echarts.min.js' %}"></script></head><body>
<main class="page-container">
  <section class="metric-panel"><table class="metric-table"><thead><tr><th>查询数据</th><th>监测设备</th><th>监测指标</th><th>正常数据</th><th>超限数据</th></tr></thead><tbody><tr><td><strong id="metricRows">0</strong><span>条</span></td><td><strong id="metricDevices">0</strong><span>台</span></td><td><strong id="metricItems">0</strong><span>项</span></td><td class="success"><strong id="metricNormal">0</strong><span>条</span></td><td class="danger"><strong id="metricAlarm">0</strong><span>条</span></td></tr></tbody></table></section>
  <nav class="page-tabs"><button class="page-tab is-active" data-tab="query">监控数据查询</button><button class="page-tab" data-tab="statistics">自定义统计</button></nav>
  <section id="queryPanel" class="tab-panel">
    <div class="query-panel"><div class="query-grid"><label class="form-item date-item"><span>监测时间</span><div class="date-range"><input id="queryStart" type="date"><b>至</b><input id="queryEnd" type="date"></div></label><label class="form-item"><span>设备类型</span><select id="queryType"><option value="设备能耗监测设备">设备能耗监测设备</option><option value="温湿度监测设备">温湿度监测设备</option></select></label><label class="form-item"><span>设备名称</span><select id="queryDevice"><option value="">全部设备</option></select></label><label class="form-item"><span>所属科室</span><select id="queryArea"><option value="">全部科室</option></select></label><label class="form-item"><span>监测指标</span><select id="queryItem"></select></label><label class="form-item"><span>数据状态</span><select id="queryStatus"><option value="">全部状态</option><option>正常</option><option>超限</option><option>无效</option></select></label><div class="query-actions"><button class="button" data-reset="query">重置</button><button class="button primary" data-search="query">查询</button></div></div></div>
    <section class="chart-grid"><article class="chart-card"><header><i></i><h2 id="trendTitle">温度趋势（℃）</h2></header><div id="trendChart" class="chart"></div><div id="trendEmpty" class="chart-empty is-hidden">请选择一个具体的数值指标查看趋势</div></article><article class="chart-card"><header><i></i><h2>数据状态分布</h2></header><div id="statusChart" class="chart"></div></article></section>
    <section class="list-panel"><header class="panel-title"><i></i><h2>监控数据明细</h2><em id="querySummary"></em><button id="exportQuery" class="button title-action">导出当前结果</button></header><div class="table-scroll"><table class="data-table"><thead><tr><th class="actions">操作</th><th>序号</th><th>监测时间</th><th>设备编号</th><th>设备名称</th><th>采集端</th><th>设备类型</th><th>所属科室</th><th>监测指标</th><th>监测值</th><th>单位</th><th>数据状态</th></tr></thead><tbody id="queryRows"></tbody></table><div id="queryEmpty" class="empty is-hidden">暂无符合条件的监控数据</div></div><div id="queryPager" class="pagination"></div></section>
  </section>
  <section id="statisticsPanel" class="tab-panel is-hidden">
    <div class="query-panel"><div class="statistics-grid"><label class="form-item date-item"><span>统计时间</span><div class="date-range"><input id="statStart" type="date"><b>至</b><input id="statEnd" type="date"></div></label><label class="form-item"><span>设备类型</span><select id="statType"><option value="设备能耗监测设备">设备能耗监测设备</option><option value="温湿度监测设备">温湿度监测设备</option></select></label><label class="form-item"><span>监测指标</span><select id="statItem"></select></label><label class="form-item"><span>分组维度</span><select id="groupBy"><option value="area">所属科室</option><option value="type">设备类型</option><option value="device">设备名称</option><option value="item">监测指标</option><option value="day">监测日期</option></select></label><label class="form-item"><span>统计方式</span><select id="aggregate"><option value="count">数据量</option><option value="avg">平均值</option><option value="max">最大值</option><option value="min">最小值</option><option value="delta">累计增量</option><option value="alarmRate">超限率</option></select></label><label class="form-item"><span>图表类型</span><select id="chartType"><option value="bar">柱状图</option><option value="line">折线图</option><option value="pie">饼图</option></select></label><div class="query-actions"><button class="button" data-reset="statistics">重置</button><button class="button primary" id="runStatistics">生成统计</button></div></div></div>
    <section class="statistics-layout"><article class="chart-card statistics-chart"><header><i></i><h2 id="statisticsTitle">自定义统计图</h2></header><div id="customChart" class="chart large"></div><div id="customEmpty" class="chart-empty is-hidden">当前条件下暂无统计数据</div></article><section class="list-panel statistics-table-card"><header class="panel-title"><i></i><h2>统计结果</h2><em id="statisticsSummary"></em></header><div class="table-scroll"><table class="statistics-table"><thead><tr><th>序号</th><th id="groupTitle">分组</th><th id="valueTitle">统计值</th><th>样本数</th><th>超限数</th></tr></thead><tbody id="statisticsRows"></tbody></table><div id="statisticsEmpty" class="empty is-hidden">暂无统计结果</div></div></section></section>
  </section>
</main>
<div id="detailModal" class="modal is-hidden"><div class="mask" data-close></div><section class="modal-card"><header><h2>监控数据详情</h2><button data-close>×</button></header><div id="detailBody" class="detail-body"></div><footer><button class="button primary" data-close>关闭</button></footer></section></div><div id="toast" class="toast is-hidden"></div>
<script src="{% static 'ynjksys/syswljk_wsd_service.js' %}?v=2026081701"></script><script src="{% static 'ynjksys/syswljk_energy_service.js' %}?v=2026081701"></script><script src="{% static 'ynjksys/syswljk_cxtj_service.js' %}?v=2026081401"></script><script src="{% static 'ynjksys/syswljk_cxtj_list.js' %}?v=2026081403"></script></body></html>
