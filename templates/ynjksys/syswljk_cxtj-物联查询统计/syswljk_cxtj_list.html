{% load static %}
<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>物联查询统计</title><link rel="stylesheet" href="{% static 'ynjksys/syswljk_cxtj_list.css' %}?v=2026081801"><style>.statistics-config{grid-template-columns:repeat(4,minmax(220px,1fr))}.measure-field{grid-column:1/-1;align-items:flex-start}.measure-field>span{padding-top:9px}.measure-options{display:flex;flex-wrap:wrap;gap:10px 22px;min-height:40px;align-items:center}.measure-options label{display:flex;align-items:center;gap:6px}.measure-options input{width:16px;height:16px}.multi-select{position:relative;flex:1;min-width:0}.multi-select-trigger{width:100%;height:40px;padding:0 14px;border:1px solid #cfd9e8;border-radius:4px;background:#fff;color:#26364d;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.multi-select-trigger span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.multi-select-trigger i{width:8px;height:8px;border-right:2px solid #26364d;border-bottom:2px solid #26364d;transform:rotate(45deg);margin:0 3px 5px 12px}.multi-select.is-open .multi-select-trigger i{transform:rotate(225deg);margin-bottom:-3px}.multi-select-panel{display:none;position:absolute;z-index:30;top:44px;left:0;width:100%;min-width:260px;max-height:320px;overflow:auto;border:1px solid #aebbd0;border-radius:4px;background:#fff;box-shadow:0 8px 22px rgba(31,50,78,.16)}.multi-select.is-open .multi-select-panel{display:block}.multi-select-option{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer}.multi-select-option:hover{background:#f3f7fd}.multi-select-option.all{position:sticky;top:0;z-index:1;border-bottom:1px solid #e3e9f1;background:#f7f9fc;font-weight:600}.multi-select-option input{width:16px;height:16px;flex:none}.analysis-summary{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:14px;border:1px solid var(--line);background:#fff}.analysis-summary div{padding:14px 20px;border-right:1px solid var(--line)}.analysis-summary div:last-child{border:0}.analysis-summary span{display:block;color:#7d8999}.analysis-summary strong{display:block;margin-top:7px;color:var(--primary);font-size:22px}.bi-layout{display:grid;gap:14px}.pivot-table{min-width:1000px}.pivot-table th,.pivot-table td{text-align:right!important}.pivot-table th:first-child,.pivot-table td:first-child,.pivot-table th:nth-child(2),.pivot-table td:nth-child(2){text-align:left!important}.pivot-cell{border:0;background:none;color:var(--primary);cursor:pointer}.drill-table{width:100%;border-collapse:collapse}.drill-table th,.drill-table td{padding:9px;border-bottom:1px solid #e7ebf1;text-align:left}.drill-table th{background:#f5f7fa}.modal-body{padding:20px;max-height:calc(100vh - 180px);overflow:auto}.modal-card.wide{width:min(1100px,calc(100vw - 48px))}@media(max-width:1280px){.statistics-config{grid-template-columns:repeat(2,minmax(240px,1fr))}}</style><script src="{% static 'common/isvar.js' %}"></script><script src="{% static 'common/isqrydata.js' %}"></script><script src="{% static 'ynjksys/syswljk_query_guard.js' %}?v=2026081701"></script><script src="{% static 'lib/echarts/echarts.min.js' %}"></script></head><body>
<main class="page-container">
  <section class="metric-panel"><table class="metric-table"><thead><tr><th>查询数据</th><th>监测设备</th><th>监测指标</th><th>正常数据</th><th>超限数据</th></tr></thead><tbody><tr><td><strong id="metricRows">0</strong><span>条</span></td><td><strong id="metricDevices">0</strong><span>台</span></td><td><strong id="metricItems">0</strong><span>项</span></td><td class="success"><strong id="metricNormal">0</strong><span>条</span></td><td class="danger"><strong id="metricAlarm">0</strong><span>条</span></td></tr></tbody></table></section>
  <nav class="page-tabs"><button class="page-tab is-active" data-tab="query">监控数据查询</button><button class="page-tab" data-tab="statistics">自定义统计</button></nav>
  <section id="queryPanel" class="tab-panel">
    <div class="query-panel"><div class="query-grid"><label class="form-item date-item"><span>监测时间</span><div class="date-range"><input id="queryStart" type="date"><b>至</b><input id="queryEnd" type="date"></div></label><label class="form-item"><span>设备类型</span><select id="queryType"><option value="设备能耗监测设备">设备能耗监测设备</option><option value="温湿度监测设备">温湿度监测设备</option></select></label><label class="form-item"><span>设备名称</span><select id="queryDevice"><option value="">全部设备</option></select></label><label class="form-item"><span>所属科室</span><select id="queryArea"><option value="">全部科室</option></select></label><label class="form-item"><span>监测指标</span><select id="queryItem"></select></label><label class="form-item"><span>数据状态</span><select id="queryStatus"><option value="">全部状态</option><option>正常</option><option>超限</option><option>无效</option></select></label><div class="query-actions"><button class="button" data-reset="query">重置</button><button class="button primary" data-search="query">查询</button></div></div></div>
    <section class="chart-grid"><article class="chart-card"><header><i></i><h2 id="trendTitle">温度趋势（℃）</h2></header><div id="trendChart" class="chart"></div><div id="trendEmpty" class="chart-empty is-hidden">请选择一个具体的数值指标查看趋势</div></article><article class="chart-card"><header><i></i><h2>数据状态分布</h2></header><div id="statusChart" class="chart"></div></article></section>
    <section class="list-panel"><header class="panel-title"><i></i><h2>监控数据明细</h2><em id="querySummary"></em><button id="exportQuery" class="button title-action">导出当前结果</button></header><div class="table-scroll"><table class="data-table"><thead><tr><th class="actions">操作</th><th>序号</th><th>监测时间</th><th>设备编号</th><th>设备名称</th><th>采集端</th><th>设备类型</th><th>所属科室</th><th>监测指标</th><th>监测值</th><th>单位</th><th>数据状态</th></tr></thead><tbody id="queryRows"></tbody></table><div id="queryEmpty" class="empty is-hidden">暂无符合条件的监控数据</div></div><div id="queryPager" class="pagination"></div></section>
  </section>
  <section id="statisticsPanel" class="tab-panel is-hidden">
    <div class="query-panel"><div class="statistics-grid statistics-config">
      <label class="form-item date-item"><span>统计时间</span><div class="date-range"><input id="statStart" type="date"><b>至</b><input id="statEnd" type="date"></div></label>
      <label class="form-item"><span>设备类型</span><select id="statType"><option value="设备能耗监测设备">设备能耗监测设备</option><option value="温湿度监测设备">温湿度监测设备</option></select></label>
      <label class="form-item"><span>监测指标</span><div id="statItem" class="multi-select" data-all-label="全部指标"></div></label>
      <label class="form-item"><span>设备名称</span><div id="statDevice" class="multi-select" data-all-label="全部设备"></div></label>
      <label class="form-item"><span>所属科室</span><div id="statArea" class="multi-select" data-all-label="全部科室"></div></label>
      <label class="form-item"><span>数据状态</span><div id="statStatus" class="multi-select" data-all-label="全部状态"></div></label>
      <label class="form-item"><span>行维度</span><select id="rowDimension"><option value="device">设备名称</option><option value="area">所属科室</option><option value="item">监测指标</option><option value="status">数据状态</option><option value="day">监测日期</option><option value="hour">监测小时</option><option value="socket">采集端</option></select></label>
      <label class="form-item"><span>列维度</span><select id="columnDimension"><option value="">不设置</option><option value="item" selected>监测指标</option><option value="status">数据状态</option><option value="day">监测日期</option><option value="device">设备名称</option><option value="area">所属科室</option></select></label>
      <div class="form-item measure-field"><span>度量指标</span><div class="measure-options"><label><input type="checkbox" name="statMeasure" value="count" checked>数据量</label><label><input type="checkbox" name="statMeasure" value="avg" checked>平均值</label><label><input type="checkbox" name="statMeasure" value="max">最大值</label><label><input type="checkbox" name="statMeasure" value="min">最小值</label><label><input type="checkbox" name="statMeasure" value="delta">极差</label><label><input type="checkbox" name="statMeasure" value="alarmCount">超限数</label><label><input type="checkbox" name="statMeasure" value="alarmRate">超限率</label></div></div>
      <label class="form-item"><span>图表指标</span><select id="chartMeasure"><option value="count">数据量</option><option value="avg">平均值</option><option value="max">最大值</option><option value="min">最小值</option><option value="delta">极差</option><option value="alarmCount">超限数</option><option value="alarmRate">超限率</option></select></label>
      <label class="form-item"><span>图表类型</span><select id="chartType"><option value="bar">柱状图</option><option value="line">折线图</option><option value="pie">饼图</option></select></label>
      <label class="form-item"><span>结果排序</span><select id="sortOrder"><option value="valueDesc">统计值降序</option><option value="valueAsc">统计值升序</option><option value="labelAsc">维度正序</option></select></label>
      <label class="form-item"><span>显示数量</span><select id="topN"><option value="10">前10项</option><option value="20" selected>前20项</option><option value="50">前50项</option><option value="0">全部</option></select></label>
      <div class="query-actions"><button class="button" data-reset="statistics">重置</button><button class="button primary" id="runStatistics">生成统计</button></div>
    </div></div>
    <section class="analysis-summary"><div><span>分析数据</span><strong id="analysisRows">0 条</strong></div><div><span>行维度成员</span><strong id="analysisRowGroups">0 个</strong></div><div><span>列维度成员</span><strong id="analysisColumnGroups">0 个</strong></div><div><span>度量指标</span><strong id="analysisMeasures">0 项</strong></div></section>
    <section class="bi-layout"><article class="chart-card statistics-chart"><header><i></i><h2 id="statisticsTitle">多维分析图</h2></header><div id="customChart" class="chart large"></div><div id="customEmpty" class="chart-empty is-hidden">当前条件下暂无统计数据</div></article><section class="list-panel statistics-table-card"><header class="panel-title"><i></i><h2>多维交叉统计表</h2><em id="statisticsSummary"></em><button id="exportStatistics" class="button title-action">导出统计结果</button></header><div class="table-scroll"><table class="pivot-table"><thead id="statisticsHead"></thead><tbody id="statisticsRows"></tbody></table><div id="statisticsEmpty" class="empty is-hidden">暂无统计结果</div></div></section></section>
  </section>
</main>
<div id="detailModal" class="modal is-hidden"><div class="mask" data-close></div><section id="detailModalCard" class="modal-card"><header><h2 id="detailModalTitle">监控数据详情</h2><button data-close>×</button></header><div id="detailBody" class="detail-body"></div><footer><button class="button primary" data-close>关闭</button></footer></section></div><div id="toast" class="toast is-hidden"></div>
<script src="{% static 'ynjksys/syswljk_wsd_service.js' %}?v=2026081701"></script><script src="{% static 'ynjksys/syswljk_energy_service.js' %}?v=2026081701"></script><script src="{% static 'ynjksys/syswljk_cxtj_service.js' %}?v=2026081401"></script><script src="{% static 'ynjksys/syswljk_cxtj_list.js' %}?v=2026081802"></script></body></html>
